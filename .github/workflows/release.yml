# v로 시작하는 태그(예: v0.2.1)를 올리면 Windows 설치 파일을 만들어 GitHub Releases에 올린다.
# 설치본의 자동 업데이트(electron-updater)는 이 릴리스의 latest.yml을 보고 새 버전을 받는다.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # 릴리스 만들기·파일 올리기

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # node:sqlite를 쓰는 테스트가 Node 22.13+를 요구한다
          cache: npm

      - name: 태그와 package.json 버전이 같은지 확인
        shell: bash
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "태그 $GITHUB_REF_NAME 와 package.json 버전 $expected 가 다릅니다"; exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: 설치 파일 만들고 Releases에 올리기
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
